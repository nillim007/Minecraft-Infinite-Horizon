plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
        // Automatischer Client-Test mit Screenshots (de.infinitehorizon.client.NeoForgeClientTest), Task runClientTest
        clientTest {
            client()
            gameDirectory = this.mkdir(this.file('runs/clienttest'))
            systemProperty 'infinite_horizon.clienttest', 'true'
            systemProperty 'infinite_horizon.clienttest.jei', project.hasProperty('withJei') ? 'true' : 'false'
        }
        // LAN-Test (de.infinitehorizon.client.NeoForgeLanTest): der Host öffnet seine Welt im LAN, der Gast tritt bei.
        // Beide laufen gleichzeitig; die CI startet sie direkt aus den Dateien von prepareLanHostRun/prepareLanGuestRun.
        lanHost {
            client()
            gameDirectory = this.mkdir(this.file('runs/lanhost'))
            systemProperty 'infinite_horizon.lantest', 'host'
            systemProperty 'infinite_horizon.lantest.port', '25599'
            programArguments.addAll '--username', 'Host'
        }
        lanGuest {
            client()
            gameDirectory = this.mkdir(this.file('runs/languest'))
            systemProperty 'infinite_horizon.lantest', 'guest'
            systemProperty 'infinite_horizon.lantest.port', '25599'
            programArguments.addAll '--username', 'Gast', '--quickPlayMultiplayer', '127.0.0.1:25599'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

// Rezeptanzeige (3.9): REI findet Plugins auf NeoForge über eine Annotation aus diesem Paket.
dependencies {
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
}
// JEI steckt als Jar-in-Jar im NeoForge-Jar: JEI registriert auf dem Client Rezept-Serializer, die ein LAN-Host an
// alle Mitspieler schickt; ein Mitspieler ohne JEI wird sonst abgewiesen („unknown keys … jei:jei_shaped“). Mit JEI im
// Jar haben Host und Gast immer dasselbe JEI. Ein neueres JEI im mods-Ordner gewinnt (NeoForge wählt die höchste Version).
dependencies {
    jarJar("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}
// JEI zur Laufzeit in den Entwicklungsläufen nur mit -PwithJei (CI-Jobs des NeoForge-Client-Tests und des LAN-Tests).
// Normale Builds und Server-GameTests laufen ohne JEI.
if (project.hasProperty('withJei')) {
    dependencies {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    }
}
