name: Wiki veröffentlichen

# Spiegelt docs/wiki/ (erzeugt von tools/gen_wiki.py) und docs/images/ in das GitHub-Wiki des Repositorys.
# Einmalig nötig: Im Repository unter Settings → Features „Wikis“ einschalten und im Wiki-Tab
# eine erste Seite anlegen (danach existiert das Wiki-Repository und wird hier überschrieben).

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "docs/images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    name: docs/wiki → GitHub-Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Wiki aktuell?
        run: python tools/gen_wiki.py --check
      - name: Wiki-Repository holen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo || {
            echo "::error::Wiki-Repository fehlt. Wiki in den Einstellungen einschalten und eine erste Seite anlegen."; exit 1; }
      - name: Seiten und Bilder kopieren
        run: |
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp docs/wiki/*.md wiki-repo/
          mkdir -p wiki-repo/images && cp -r docs/images/. wiki-repo/images/
          # Im GitHub-Wiki heißen Seiten ohne .md, Bilder liegen unter images/
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g; s#\(\.\./images/#(images/#g' wiki-repo/*.md
      - name: Veröffentlichen
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Keine Änderungen"; exit 0; }
          git commit -m "Wiki aus ${GITHUB_SHA::7} (docs/wiki)"
          git push
