name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  spec:
    name: Spezifikation prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Daten validieren
        run: python tools/validate_spec.py
      - name: Lesefassungen aktuell?
        run: |
          python tools/render_docs.py
          git diff --exit-code -- docs/spec/generated || (echo "::error::docs/spec/generated ist veraltet – python tools/render_docs.py ausführen" && exit 1)
      - name: Erzeugte Mod-Ressourcen aktuell?
        run: |
          python tools/gen_resources.py
          git status --porcelain -- common/src/generated
          test -z "$(git status --porcelain -- common/src/generated)" || (echo "::error::common/src/generated ist veraltet – python tools/gen_resources.py ausführen" && exit 1)

  build:
    name: Mod bauen (NeoForge + Fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Fehler als Anmerkungen ausgeben
        if: failure()
        shell: bash {0}
        run: python3 .github/scripts/annotate_log.py build.log
      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          retention-days: 7
