name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  spec:
    name: Spezifikation prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Daten validieren
        run: python tools/validate_spec.py
      - name: Lesefassungen aktuell?
        run: |
          python tools/render_docs.py
          git diff --exit-code -- docs/spec/generated || (echo "::error::docs/spec/generated ist veraltet – python tools/render_docs.py ausführen" && exit 1)
      - name: Erzeugte Mod-Ressourcen aktuell?
        run: |
          python tools/gen_resources.py
          python tools/gen_gametests.py
          G="common/src/generated common/src/main/java/de/sternenwerft/gametest/SwTestCatalog.java fabric/src/main/java/de/sternenwerft/gametest/SwFabricGameTests.java"
          git status --porcelain -- $G
          test -z "$(git status --porcelain -- $G)" || (echo "::error::Erzeugte Dateien veraltet – python tools/gen_resources.py und python tools/gen_gametests.py ausführen" && exit 1)

  build:
    name: Mod bauen (NeoForge + Fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: GameTests NeoForge
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :neoforge:runGameTestServer --stacktrace --no-daemon 2>&1 | tee gametest-neoforge.log
      - name: GameTests Fabric
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :fabric:runGameTestServer --stacktrace --no-daemon 2>&1 | tee gametest-fabric.log
      - name: GameTest-Zusammenfassung
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          for f in gametest-neoforge.log gametest-fabric.log; do
            python3 .github/scripts/annotate_log.py --summary "$f"
          done
      - name: Fehler als Anmerkungen ausgeben
        if: failure()
        shell: bash {0}
        run: |
          for f in build.log gametest-neoforge.log gametest-fabric.log; do
            if [ -f "$f" ]; then python3 .github/scripts/annotate_log.py "$f"; fi
          done
      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            build.log
            gametest-neoforge.log
            gametest-fabric.log
          if-no-files-found: ignore
          retention-days: 7

  client_test:
    name: Client-Test mit Screenshots (Fabric)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Software-Grafik und Spieloptionen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers
          mkdir -p fabric/build/clientgametest
          echo "eula=true" > fabric/build/clientgametest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"opengl"\n' > fabric/build/clientgametest/options.txt
      - name: Client-GameTest
        id: client
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :fabric:runClientGameTest --stacktrace --no-daemon 2>&1 | tee clientgametest.log
      - name: Fehler als Anmerkungen
        if: failure()
        shell: bash {0}
        run: python3 .github/scripts/annotate_log.py clientgametest.log
      - name: Screenshots in Branch ci-screenshots
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=fabric/build/clientgametest/screenshots
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then echo "::warning title=Screenshots::keine Screenshots"; exit 0; fi
          tmp=$(mktemp -d)
          cp "$dir"/*.png "$tmp"/
          cp clientgametest.log "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots für ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "::notice title=Screenshots-Zusammenfassung::$(ls *.png | tr '\n' ' ')"
