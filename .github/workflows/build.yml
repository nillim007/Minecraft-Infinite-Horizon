name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  spec:
    name: Spezifikation prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Daten validieren
        run: python tools/validate_spec.py
      - name: Lesefassungen aktuell?
        run: |
          python tools/render_docs.py
          git diff --exit-code -- docs/spec/generated || (echo "::error::docs/spec/generated ist veraltet – python tools/render_docs.py ausführen" && exit 1)
      - name: Erzeugte Mod-Ressourcen aktuell?
        run: |
          python tools/gen_resources.py
          python tools/gen_gametests.py
          G="common/src/generated common/src/main/java/de/infinitehorizon/gametest/IhTestCatalog.java fabric/src/main/java/de/infinitehorizon/gametest/IhFabricGameTests.java"
          git status --porcelain -- $G
          test -z "$(git status --porcelain -- $G)" || (echo "::error::Erzeugte Dateien veraltet – python tools/gen_resources.py und python tools/gen_gametests.py ausführen" && exit 1)
      - name: Wiki und README aktuell, alle Objekte dokumentiert?
        run: python tools/gen_wiki.py --check || (echo "::error::Wiki/README unvollständig oder veraltet – fehlende Objekte in docs/handbook/pages eintragen, dann python tools/gen_wiki.py ausführen" && exit 1)
      - name: Balancing-Übersicht (Abnahme M9)
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          python tools/balance_sheet.py > balance-sheet.txt
          { echo "### Balancing-Übersicht"; echo '```'; cat balance-sheet.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Mod bauen (NeoForge + Fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: GameTests NeoForge
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :neoforge:runGameTestServer --stacktrace --no-daemon 2>&1 | tee gametest-neoforge.log
      - name: GameTests Fabric
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :fabric:runGameTestServer --stacktrace --no-daemon 2>&1 | tee gametest-fabric.log
      - name: GameTest-Zusammenfassung
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          for f in gametest-neoforge.log gametest-fabric.log; do
            python3 .github/scripts/annotate_log.py --summary "$f"
          done
      - name: Fehler als Anmerkungen ausgeben
        if: failure()
        shell: bash {0}
        run: |
          for f in build.log gametest-neoforge.log gametest-fabric.log; do
            if [ -f "$f" ]; then python3 .github/scripts/annotate_log.py "$f"; fi
          done
      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            build.log
            gametest-neoforge.log
            gametest-fabric.log
          if-no-files-found: ignore
          retention-days: 7

  client_test:
    name: Client-Test mit Screenshots (Fabric)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Software-Grafik und Spieloptionen
        run: |
          # Paketspiegel fallen gelegentlich aus: bis zu 3 Versuche
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
          mkdir -p fabric/build/clientgametest
          echo "eula=true" > fabric/build/clientgametest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"opengl"\n' > fabric/build/clientgametest/options.txt
      - name: Client-GameTest
        id: client
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :fabric:runClientGameTest -PwithRei --stacktrace --no-daemon 2>&1 | tee clientgametest.log
      - name: Fehler als Anmerkungen
        if: failure()
        shell: bash {0}
        run: python3 .github/scripts/annotate_log.py clientgametest.log
      - name: Screenshots in Branch ci-screenshots
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=fabric/build/clientgametest/screenshots
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then echo "::warning title=Screenshots::keine Screenshots"; exit 0; fi
          tmp=$(mktemp -d)
          cp "$dir"/*.png "$tmp"/
          cp clientgametest.log "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots für ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "::notice title=Screenshots-Zusammenfassung::$(ls *.png | tr '\n' ' ')"

  neoforge_client_test:
    name: Client-Test mit Screenshots (NeoForge)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Virtuelle Anzeige, Software-Grafik und Spieloptionen
        run: |
          # Paketspiegel fallen gelegentlich aus: bis zu 3 Versuche
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 mesa-vulkan-drivers && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
          mkdir -p neoforge/runs/clienttest
          printf 'version:4896\npreferredGraphicsBackend:"opengl"\nonboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nnarrator:0\n' > neoforge/runs/clienttest/options.txt
      - name: NeoForge-Client-Test
        timeout-minutes: 30
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :neoforge:runClientTest -PwithJei --stacktrace --no-daemon 2>&1 | tee neoforge-clienttest.log
      - name: Ergebnis auswerten
        if: always()
        shell: bash
        run: |
          f=neoforge/runs/clienttest/infinite_horizon-clienttest.txt
          if [ ! -f "$f" ]; then echo "::error title=NeoForge-Client-Test::keine Ergebnisdatei (Absturz oder Zeitüberschreitung)"; python3 .github/scripts/annotate_log.py neoforge-clienttest.log; exit 1; fi
          echo "::notice title=NeoForge-Client-Zusammenfassung::$(tr '\n' ' ' < "$f")"
          grep -q '^DONE' "$f" || { echo "::error title=NeoForge-Client-Test::nicht bis zum Ende gelaufen"; exit 1; }
          if grep -q '^FAIL' "$f"; then grep '^FAIL' "$f" | while read -r l; do echo "::error title=NeoForge-Client-Test::$l"; done; exit 1; fi
      - name: Screenshots in Branch ci-screenshots-neoforge
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=neoforge/runs/clienttest/screenshots
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then echo "::warning title=Screenshots::keine NeoForge-Screenshots"; exit 0; fi
          tmp=$(mktemp -d)
          cp "$dir"/*.png "$tmp"/
          cp neoforge-clienttest.log "$tmp"/ 2>/dev/null || true
          cp neoforge/runs/clienttest/infinite_horizon-clienttest.txt "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b ci-screenshots-neoforge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NeoForge-Screenshots für ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-neoforge

  lan-neoforge:
    # LAN-Test: zwei echte NeoForge-Clients (Host öffnet seine Welt im LAN, Gast tritt per quickPlay bei), beide mit dem
    # JEI, das im Release-Jar steckt. Prüft außerdem, dass JEI als Jar-in-Jar im NeoForge-Jar liegt.
    name: LAN-Test (NeoForge)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Virtuelle Anzeige, Software-Grafik und Spieloptionen
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 mesa-vulkan-drivers && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
          for d in lanhost languest; do
            mkdir -p neoforge/runs/$d
            printf 'version:4896\npreferredGraphicsBackend:"opengl"\nonboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nnarrator:0\n' > neoforge/runs/$d/options.txt
          done
      - name: Jar bauen und JEI darin prüfen
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :neoforge:jar :neoforge:createLanHostLaunchScript :neoforge:createLanGuestLaunchScript -PwithJei --stacktrace --no-daemon
          jar=$(ls neoforge/build/libs/infinite_horizon-neoforge-*.jar | grep -v -e sources -e javadoc)
          unzip -l "$jar" | grep -q 'META-INF/jarjar/jei-' || { echo "::error title=LAN-Test::JEI fehlt im NeoForge-Jar ($jar)"; exit 1; }
          ls neoforge/build/moddev/runLanHost* neoforge/build/moddev/runLanGuest*
      - name: Host und Gast starten
        timeout-minutes: 25
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash neoforge/build/moddev/runLanHost.sh > lan-host.log 2>&1 &
          host=$!
          for i in $(seq 1 120); do
            [ -f neoforge/runs/lanhost/lan-ready.txt ] && break
            kill -0 "$host" 2>/dev/null || { echo "::error title=LAN-Test::Host beendet, bevor die Welt im LAN offen war"; exit 1; }
            sleep 5
          done
          [ -f neoforge/runs/lanhost/lan-ready.txt ] || { echo "::error title=LAN-Test::Host nicht bereit (10 Minuten)"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x720x24" bash neoforge/build/moddev/runLanGuest.sh > lan-guest.log 2>&1 || true
          for i in $(seq 1 60); do kill -0 "$host" 2>/dev/null || break; sleep 5; done
          kill "$host" 2>/dev/null || true
      - name: Ergebnis auswerten
        if: always()
        shell: bash
        run: |
          # Bash läuft hier mit -e -o pipefail: grep ohne Treffer darf den Schritt nicht beenden
          if grep -q "Client disconnected with reason" lan-guest.log lan-host.log 2>/dev/null; then
            grep -h "Client disconnected with reason" lan-guest.log lan-host.log | while read -r l; do echo "::error title=LAN-Test Trennung::$l"; done
          fi
          rc=0
          for role in lanhost languest; do
            f=neoforge/runs/$role/infinite_horizon-lantest.txt
            log=lan-${role#lan}.log
            if [ ! -f "$f" ]; then
              echo "::error title=LAN-Test $role::keine Ergebnisdatei"
              [ -f "$log" ] && python3 .github/scripts/annotate_log.py "$log" || true
              rc=1; continue
            fi
            echo "::notice title=LAN-Test $role::$(tr '\n' ' ' < "$f")"
            grep -q '^DONE' "$f" || { echo "::error title=LAN-Test $role::nicht bis zum Ende gelaufen"; rc=1; }
            if grep -q '^FAIL' "$f"; then grep '^FAIL' "$f" | while read -r l; do echo "::error title=LAN-Test $role::$l"; done; rc=1; fi
          done
          exit $rc
      - name: LAN-Logs sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lan-test-logs
          path: |
            lan-host.log
            lan-guest.log
            neoforge/runs/lanhost/logs/latest.log
            neoforge/runs/languest/logs/latest.log
          if-no-files-found: ignore
